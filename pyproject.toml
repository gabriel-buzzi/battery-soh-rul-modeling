[project]
authors = [{name = "Gabriel Buzzi Sanches", email = "gabrielbuzzi2@gmail.com"}]
dependencies = ["hydra-core>=1.3.2,<2"]
name = "severson_features_soh_rul"
requires-python = "~=3.10.0"
version = "1.0.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
line-length = 79
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]  # Enable PEP8, isort, and docstring checks

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = "~=3.10.0"
ruff = "*"
pip = "*"
pre-commit = ">=4.2.0,<5"
ipykernel = ">=6.29.5,<7"
jupyter = ">=1.1.1,<2"
tqdm = ">=4.67.1,<5"
numpy = ">=2.2.6,<3"
pandas = ">=2.3.1,<3"
h5py = ">=3.14.0,<4"
pyarrow = ">=21.0.0,<22"
scipy = ">=1.15.2,<2"
matplotlib = ">=3.10.3,<4"
scikit-learn = ">=1.7.1,<2"
plotly = ">=6.2.0,<7"
seaborn = ">=0.13.2,<0.14"
optuna = ">=4.4.0,<5"
xgboost = ">=3.0.2,<4"
hydra-joblib-launcher = ">=1.2.0,<2"
lightgbm = ">=4.6.0,<5"
pandoc = ">=3.8.3,<4"
jupytext = ">=1.19.1,<2"

[tool.pixi.pypi-dependencies]
severson_features_soh_rul = { path = ".", editable = true }

[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

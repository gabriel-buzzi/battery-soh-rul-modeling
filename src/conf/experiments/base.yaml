# ----------------------------
# Core experiment selectors
# ----------------------------
track: baseline_evaluation # active runner branch; usually overridden via `tracks=<name>`
target: SOH # prediction target: SOH | RUL | RUL_THROUGHPUT
random_seed: 42 # global seed for split/optimization/model reproducibility

# ----------------------------
# Input data and split control
# ----------------------------
data:
  features_data_path: ../data/interim/features.parquet # feature table generated by `src.data.make_features`
  split_dir: ../results/experiments/splits # persisted train/test cell split location
  train_cells_proportion: 0.8 # fraction of cells used for training split
  force_recreate_split: false # true -> ignore saved split and regenerate from seed

# ----------------------------
# Feature view selection
# ----------------------------
features:
  view: full_all # full_all | charge_all | full_plus_charge_all | no_temperature | custom; used by baseline_evaluation/uncertainty/diagnostics/protocol_robustness
  custom_list: [] # used only when features.view=custom
  # Note: feature-analysis tracks override this internally:
  # - full_cycle_feature_analysis -> full feature list
  # - charge_only_feature_analysis -> charge-only feature list

# ----------------------------
# Validation/training settings
# ----------------------------
cv:
  n_splits: 5 # grouped CV folds by cell

model:
  n_jobs: 4 # model-level parallelism for ExtraTrees

# ----------------------------
# Hyperparameter search
# ----------------------------
optimize:
  n_trials: 80 # feasible paper default: good coverage without excessive runtime

optimization_cache:
  enabled: true # reuse optimization by deterministic cache key
  dir: null # null -> <artifacts.root_dir>/_optimization_cache

# ----------------------------
# Feature-analysis track options
# ----------------------------
feature_analysis:
  ranking_seeds: [42, 52, 62, 72, 82] # seed set for ranking stability analysis
  k_values: [16, 12, 10, 8, 6, 4, 2] # top-k subsets evaluated in sweep
  selected_k: heuristics # heuristics or explicit integer k
  max_val_rmse_increase_pct: 0.10 # heuristics tolerance vs baseline RMSE (10%)

# ----------------------------
# Uncertainty track options
# ----------------------------
uncertainty:
  n_repeats: 20 # feasible paper default for stable uncertainty quantiles
  seeds: [] # optional explicit seeds; if empty -> random_seed + [0..n_repeats-1]
  region_basis: soh_true # currently supported basis; fixed SOH-stage regioning

# ----------------------------
# Diagnostics track options
# ----------------------------
diagnostics:
  top_n_cells: 10 # number of highest-error cells to summarize

# ----------------------------
# Protocol-robustness options
# ----------------------------
protocol_robustness:
  max_c_rate_bins: 4 # initial bins for max charge C-rate before sparse-family merge
  min_cells_per_family: 6 # merge sparse protocol families below this threshold
  cells_rated_capacity: 1.1 # Ah used for C-rate normalization

# ----------------------------
# Artifact management
# ----------------------------
artifacts:
  root_dir: ./results/experiments # root output directory for track run artifacts
  run_name: null # optional fixed run id/name; null -> timestamp-based

debug_plots:
  enabled: false # disable by default for faster full paper runs

defaults:
  - _self_
  - tracks: baseline_evaluation # allows `tracks=<name>` overrides from config group
  - override hydra/launcher: joblib # enables parallel launcher for multirun mode

hydra:
  run:
    dir: . # keep execution in repo root
  output_subdir: null # avoid extra `.hydra/` run folders
  job:
    chdir: false # preserve cwd for relative paths above
  sweeper:
    params:
      track: baseline_evaluation,full_cycle_feature_analysis,charge_only_feature_analysis,uncertainty,diagnostics,protocol_robustness # used with `-m`
      target: SOH,RUL,RUL_THROUGHPUT # used with `-m`
  launcher:
    n_jobs: 1 # number of concurrent hydra multirun jobs

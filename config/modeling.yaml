stage: baseline_flow
target: SOH

data:
  features_path: data/interim/features.parquet
  protocol_column: charge_policy

split:
  train_cells_proportion: 0.8
  seed: 42
  split_dir: ./results/modeling/splits
  force_recreate: false

topk:
  k_values: [2, 4, 6, 8, 10, 12, 14, 16]
  constraints:
    tau_rmse: 0.05 # allowed percentage increase in rmse to select feasible k value
    tau_width: 0.10 # allowed percentage increase in CI width to select feasible k value

model:
  name: extratrees
  n_jobs: 1 # n_jobs for running the model

optimize:
  enabled: true
  n_trials: 10
  n_jobs: 1 # n_jobs for parallel optimization trials
  cv_folds: 5
  save_cv_trials: true
  objective:
    lambda_gap: 0.5 # overfit gap weight on final cost
  search_space:
    n_estimators:
      type: int
      low: 50
      high: 500
    criterion:
      type: fixed
      value: squared_error
    max_depth:
      type: int
      low: 3
      high: 20
    min_samples_split:
      type: int
      low: 2
      high: 20
    min_samples_leaf:
      type: int
      low: 1
      high: 10
    max_features:
      type: categorical
      choices: [sqrt, log2, null]

conformal:
  enabled: true
  alpha: 0.05 # 1 - alpha = confidence level
  calibration_proportion: 0.2

ranking:
  n_permutations: 10
  weights:
    rmse: 0.7
    uncertainty: 0.3
  rescale:
    mode: quantile_clipped_minmax
    clip_low_q: 0.05
    clip_high_q: 0.95

robustness:
  mode: protocol_lopo

weighting:
  enabled: false
  strategy: none
  n_bins: 10
  long_life_quantile: 0.75
  long_life_boost_factor: 2.0

predict:
  split: test

artifacts:
  root_dir: ./results_refactored/modeling
  naming_key: feature_id_or_hash
  run_key_fields:
    - target
    - feature_hash
    - split_seed
    - model_name
    - weighting_strategy
    - k_selected
  overwrite: false
  require_exact_match: true

defaults:
  - features: full_cycle
  - _self_
  - override hydra/launcher: joblib

hydra:
  mode: MULTIRUN
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job:
    chdir: false
  sweeper:
    params:
      target: SOH,RUL
      features: full_cycle,charge_only #,full_cycle_no_temperature,charge_only_no_temperature
  launcher:
    n_jobs: 4 # n_jobs for parallel hydra runs

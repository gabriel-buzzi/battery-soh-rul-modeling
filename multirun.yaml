hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra_plugins.hydra_joblib_launcher.joblib_launcher.JoblibLauncher
    n_jobs: 2
    backend: null
    prefer: processes
    require: null
    verbose: 0
    timeout: null
    pre_dispatch: 2*n_jobs
    batch_size: auto
    temp_folder: null
    max_nbytes: null
    mmap_mode: r
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params:
      target: SOH,RUL
      features: full_cycle
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: null
  overrides:
    hydra: []
    task: []
  job:
    name: pipeline
    chdir: false
    override_dirname: ''
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /Users/clarafarias/code/severson_features_soh_rul
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/clarafarias/code/severson_features_soh_rul/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      features: full_cycle
      environment@_global_: local
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: joblib
      hydra/output: default
  verbose: false
stage: all_stages
target: SOH
random_seed: 42
data:
  external_data_paths:
  - data/raw/2017-05-12_batchdata_updated_struct_errorcorrect.mat
  - data/raw/2017-06-30_batchdata_updated_struct_errorcorrect.mat
  - data/raw/2018-04-12_batchdata_updated_struct_errorcorrect.mat
  loaded_data_path: data/external/cells_data.h5
  min_cycle_length: 100
  max_cycle_length: 6000
  cells_rated_capacity: 1.1
  margin_for_upper_capacity_bound: 1.2
  time_jump_threshold: 400
  interpolate: false
  target_frequency: 1
  processed_cells_data_folder: data/processed/cells
  eol_definition: 80
  charge_current_threshold: 0.0
  features_path: data/interim/features.parquet
  features_data_path: ${data.features_path}
  train_cells_proportion: ${split.train_cells_proportion}
  features_process_window_size: 10
  features_process_savgol_order: 1
  train_data_path: data/interim/train_df.parquet
  test_data_path: data/interim/test_df.parquet
  protocol_column: charge_policy
analysis:
  figures_folder: ./paper/figures
  example_cell: b1c20
modeling:
  optimization_results_dir: ./results/optimization/
  evaluation_results_dir: ./results/evaluation/
split:
  train_cells_proportion: 0.8
  seed: 42
  split_dir: ./results/modeling/splits
  force_recreate: false
topk:
  k_values:
  - 2
  - 4
  - 6
  - 8
  - 10
  - 12
  - 14
  - 16
  constraints:
    tau_rmse: 0.05
    tau_width: 0.1
model:
  name: extratrees
  n_jobs: 1
optimize:
  enabled: true
  n_trials: 3
  n_jobs: 1
  cv_folds: 5
  save_cv_trials: true
  objective:
    lambda_gap: 0.5
  search_space:
    n_estimators:
      type: int
      low: 50
      high: 500
    criterion:
      type: fixed
      value: squared_error
    max_depth:
      type: int
      low: 3
      high: 20
    min_samples_split:
      type: int
      low: 2
      high: 20
    min_samples_leaf:
      type: int
      low: 1
      high: 10
    max_features:
      type: categorical
      choices:
      - sqrt
      - log2
      - null
conformal:
  enabled: true
  alpha: 0.05
  calibration_proportion: 0.2
ranking:
  n_permutations: 10
  weights:
    rmse: 0.7
    uncertainty: 0.3
  rescale:
    mode: quantile_clipped_minmax
    clip_low_q: 0.05
    clip_high_q: 0.95
robustness:
  mode: protocol_lopo
weighting:
  enabled: false
  strategy: none
  n_bins: 10
  long_life_quantile: 0.75
  long_life_boost_factor: 2.0
predict:
  split: test
artifacts:
  root_dir: ./results_refactored/modeling
  naming_key: feature_id_or_hash
  run_key_fields:
  - target
  - feature_hash
  - split_seed
  - model_name
  - weighting_strategy
  - k_selected
  overwrite: false
  require_exact_match: true
features:
  id: full_cycle
  columns:
  - V_mean
  - V_median
  - V_std
  - V_iqr
  - V_kurtosis
  - V_entropy
  - I_mean
  - I_median
  - I_std
  - I_iqr
  - I_kurtosis
  - T_mean
  - T_median
  - T_std
  - T_iqr
  - T_kurtosis
